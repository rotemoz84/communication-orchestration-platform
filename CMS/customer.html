<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="customerDetails">Customer Details - Communication Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="translations.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status-badge {
            @apply px-2 py-1 text-xs font-medium rounded-full;
        }
        
        .timeline-item {
            @apply border-l-2 border-gray-200 pl-4 relative;
        }
        
        .timeline-item::before {
            content: '';
            @apply absolute left-0 top-0 w-3 h-3 bg-white border-2 border-gray-200 rounded-full -translate-x-1/2;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <!-- Back to CMS -->
                    <a href="index.html" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i>
                        <span data-i18n="backToCMS">Back to CMS</span>
                    </a>
                    
                    <!-- Language Selector -->
                    <div class="relative">
                        <select id="languageSelector" onchange="setLanguage(this.value)" class="appearance-none bg-white border border-gray-300 rounded-md px-3 py-2 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="en">English</option>
                            <option value="he">עברית</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                            <i class="fas fa-globe text-sm"></i>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <span id="lastUpdated" class="text-sm text-gray-500"></span>
                    <button onclick="refreshCustomerData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-sync-alt mr-2"></i>
                        <span data-i18n="refresh">Refresh</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Customer Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center">
                        <i class="fas fa-user text-2xl text-gray-500"></i>
                    </div>
                    <div>
                        <h1 id="customerName" class="text-2xl font-bold text-gray-900"></h1>
                        <p id="customerStatus" class="text-sm text-gray-600"></p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-3">
                    <button onclick="editCustomer()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-edit mr-2"></i>
                        <span data-i18n="edit">Edit</span>
                    </button>
                    <button onclick="addNote()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-plus mr-2"></i>
                        <span data-i18n="addNote">Add Note</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Customer Information Tabs -->
        <div class="bg-white rounded-lg shadow-md mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button onclick="switchTab('profile')" id="profileTab" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        <i class="fas fa-user mr-2"></i>
                        <span data-i18n="profile">Profile</span>
                    </button>
                    <button onclick="switchTab('history')" id="historyTab" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        <i class="fas fa-history mr-2"></i>
                        <span data-i18n="history">History</span>
                    </button>
                    <button onclick="switchTab('contacts')" id="contactsTab" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        <i class="fas fa-address-book mr-2"></i>
                        <span data-i18n="contacts">Contacts</span>
                    </button>
                    <button onclick="switchTab('funnel')" id="funnelTab" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                        <i class="fas fa-filter mr-2"></i>
                        <span data-i18n="funnel">Funnel</span>
                    </button>
                </nav>
            </div>

            <!-- Tab Content -->
            <div class="p-6">
                <!-- Profile Tab -->
                <div id="profileContent" class="tab-content hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Basic Information -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="basicInfo">Basic Information</h3>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="fullName">Full Name</label>
                                    <p id="customerFullName" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="phone">Phone Number</label>
                                    <p id="customerPhone" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="email">Email Address</label>
                                    <p id="customerEmail" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="address">Address</label>
                                    <p id="customerAddress" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Health Information -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="healthInfo">Health Information</h3>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="pregnancyWeek">Pregnancy Week</label>
                                    <div class="flex items-center space-x-3 mt-1">
                                        <p id="pregnancyWeek" class="text-sm text-gray-900"></p>
                                        <span id="pregnancyMilestone" class="text-xs text-blue-600"></span>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="ultrasoundDate">Ultrasound Scan Date</label>
                                    <p id="ultrasoundDate" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="otherChildren">Other Children</label>
                                    <p id="otherChildren" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- History Tab -->
                <div id="historyContent" class="tab-content hidden">
                    <div class="space-y-6">
                        <!-- Request History -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="requestHistory">Request History</h3>
                            <div id="requestHistory" class="space-y-3">
                                <!-- Request history items will be populated here -->
                            </div>
                        </div>
                        
                        <!-- Communication History -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="communicationHistory">Communication History</h3>
                            <div id="communicationHistory" class="space-y-3">
                                <!-- Communication history items will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contacts Tab -->
                <div id="contactsContent" class="tab-content hidden">
                    <div class="space-y-6">
                        <!-- Primary Contact -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="primaryContact">Primary Contact</h3>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="relationshipType">Relationship Type</label>
                                        <p id="primaryRelationshipType" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="contactName">Name</label>
                                        <p id="primaryContactName" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="contactPhone">Phone</label>
                                        <p id="primaryContactPhone" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="contactEmail">Email</label>
                                        <p id="primaryContactEmail" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Additional Contacts -->
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-medium text-gray-900" data-i18n="additionalContacts">Additional Contacts</h3>
                                <button onclick="addContact()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                                    <i class="fas fa-plus mr-2"></i>
                                    <span data-i18n="addContact">Add Contact</span>
                                </button>
                            </div>
                            <div id="additionalContacts" class="space-y-3">
                                <!-- Additional contacts will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Funnel Tab -->
                <div id="funnelContent" class="tab-content hidden">
                    <div class="space-y-6">
                        <!-- Funnel Process -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="funnelProcess">Funnel Process</h3>
                            <div class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="firstCallDate">First Call Date</label>
                                        <p id="firstCallDate" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="hasNeed">Has Need Clinic Can Provide?</label>
                                        <p id="hasNeed" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="familiarWithDoctor">Familiar with Doctor?</label>
                                        <p id="familiarWithDoctor" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="understandsPricing">Understands Pricing Advantage?</label>
                                        <p id="understandsPricing" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="bookedSession">Booked a Session?</label>
                                        <p id="bookedSession" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700" data-i18n="bookedCallWithDoctor">Booked a Call with Doctor?</label>
                                        <p id="bookedCallWithDoctor" class="mt-1 text-sm text-gray-900"></p>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700" data-i18n="nextFollowUp">Next Follow-up</label>
                                    <p id="nextFollowUp" class="mt-1 text-sm text-gray-900"></p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Call Log -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4" data-i18n="callLog">Historic Call Log</h3>
                            <div id="callLog" class="space-y-3">
                                <!-- Call log items will be populated here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white fade-in">
            <div class="flex justify-between items-start mb-4">
                <h3 id="editModalTitle" class="text-lg font-medium text-gray-900"></h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editForm" onsubmit="saveEditForm(event)" class="space-y-4">
                <div id="editFormContent"></div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        <span data-i18n="cancel">Cancel</span>
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 border border-transparent rounded-md text-sm font-medium text-white hover:bg-blue-700">
                        <i class="fas fa-save mr-2"></i>
                        <span data-i18n="save">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="customer.js"></script>
</body>
</html>
